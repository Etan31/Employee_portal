<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Hardcoded hex: favicons render outside the app's CSS cascade, so this can't use
       a CSS custom property. Box fill matches the nx logo bg token; text fill matches
       the nx accent token. Keep both in sync with theme.css if those tokens change. -->
  <rect x="1" y="1" width="30" height="30" rx="9" fill="#060a18"/>
  <text x="16" y="17" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="19" fill="#38bdf8">N</text>
</svg>
