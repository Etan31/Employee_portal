name: Supabase Keepalive

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::SUPABASE_URL and/or SUPABASE_ANON_KEY secrets are not set."
            exit 1
          fi

          CLEAN_URL=$(printf '%s' "$SUPABASE_URL" | tr -d '\r\n' | sed 's:/*$::')
          BODY_FILE=$(mktemp)

          HTTP_STATUS=$(curl -sS -o "$BODY_FILE" -w "%{http_code}" \
            "${CLEAN_URL}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${SUPABASE_KEY}") || CURL_EXIT=$?

          CURL_EXIT=${CURL_EXIT:-0}
          echo "curl exit: $CURL_EXIT | HTTP status: $HTTP_STATUS"

          if [ "$CURL_EXIT" -eq 0 ] && [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Supabase keepalive ping succeeded."
            rm -f "$BODY_FILE"
          else
            echo "Response body:"
            cat "$BODY_FILE"
            echo ""
            rm -f "$BODY_FILE"
            echo "::error::Keepalive ping failed (curl exit $CURL_EXIT, HTTP $HTTP_STATUS)."
            exit 1
          fi
