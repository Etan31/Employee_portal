name: Supabase Keepalive

# Keeps the Supabase free-tier project from being paused after 7 days of
# inactivity by pinging the REST API on a schedule. Any request counts as
# activity and resets the pause timer.

on:
  schedule:
    # Runs daily at 06:00 UTC. Well under the 7-day inactivity window, with
    # plenty of margin even if GitHub delays or skips the occasional run.
    - cron: "0 6 * * *"
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL and/or SUPABASE_ANON_KEY secrets are not set."
            exit 1
          fi

          echo "Pinging Supabase to keep the project alive..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "HTTP status: $HTTP_STATUS"

          # 2xx = healthy. A 200 with an empty array (due to RLS) still counts
          # as database activity, which is all we need.
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Supabase keepalive ping succeeded."
          else
            echo "::error::Keepalive ping failed with status $HTTP_STATUS"
            exit 1
          fi
