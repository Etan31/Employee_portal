name: Backend Keepalive

# Alternative to supabase-keepalive.yml. Pings the Express backend's deep
# health check (/health/db), which queries the database. A single ping keeps
# BOTH the backend host (if it sleeps on idle, e.g. Render/Railway free tier)
# AND the Supabase project alive.
#
# You typically want ONE keepalive running, not both:
#   - Use supabase-keepalive.yml if the backend isn't deployed / is serverless.
#   - Use this one if the backend is deployed on a host that sleeps when idle.

on:
  schedule:
    # Runs daily at 06:00 UTC.
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend deep health check
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "::error::BACKEND_URL secret is not set (e.g. https://your-app.onrender.com)."
            exit 1
          fi

          echo "Pinging ${BACKEND_URL}/health/db ..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 \
            "${BACKEND_URL}/health/db")

          echo "HTTP status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Backend + database keepalive ping succeeded."
          else
            echo "::error::Keepalive ping failed with status $HTTP_STATUS"
            exit 1
          fi
